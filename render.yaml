services:
  - type: web
    name: a2a-invoice-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PUBLIC_BASE_URL
        value: https://a2a-invoice-agent-3ztr.onrender.com
      - key: DATABASE_PATH
        value: /var/data/invoice_agent.db
